<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #26354a;
        }

        header {
            background: #173b70;
            color: white;
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        main { padding: 25px 5%; }

        .panel {
            background: white;
            padding: 22px;
            margin-bottom: 22px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #0001;
        }

        input, select, button {
            padding: 10px;
            margin: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background: #1769aa;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover { background: #104d80; }

        .delete {
            background: #dc2626;
        }

        .table-wrap { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 580px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
        }

        th { background: #f8fafc; }

        .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat {
            background: white;
            border-radius: 8px;
            padding: 20px;
            flex: 1;
            min-width: 140px;
        }

        .stat strong {
            display: block;
            font-size: 25px;
            color: #1769aa;
            margin-top: 8px;
        }

        @media (max-width: 500px) {
            header { padding: 16px; }
            main { padding: 16px; }
        }
    </style>
</head>
<body>

<header>
    <div>
        <h2>Admin Dashboard</h2>
        <span>Student Attendance Management</span>
    </div>
    <button onclick="logout()">Logout</button>
</header>

<main>
    <section class="stats">
        <div class="stat">
            Total Students
            <strong id="totalStudents">0</strong>
        </div>
        <div class="stat">
            Present Today
            <strong id="presentToday">0</strong>
        </div>
        <div class="stat">
            Absent Today
            <strong id="absentToday">0</strong>
        </div>
    </section>

    <section class="panel">
        <h2>Add Student</h2>

        <form id="studentForm">
            <input id="studentId" placeholder="Student ID (e.g. S004)"
                   required>
            <input id="studentName" placeholder="Student Name" required>
            <button type="submit">Add Student</button>
        </form>
    </section>

    <section class="panel">
        <h2>Mark Attendance</h2>

        <label for="attendanceDate">Select Date:</label>
        <input type="date" id="attendanceDate" required>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Name</th>
                        <th>Attendance Status</th>
                    </tr>
                </thead>
                <tbody id="attendanceTable"></tbody>
            </table>
        </div>

        <button onclick="saveAttendance()">Save Attendance</button>
        <p id="message"></p>
    </section>

    <section class="panel">
        <h2>Attendance Records</h2>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Name</th>
                        <th>Date</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="recordsTable"></tbody>
            </table>
        </div>
    </section>
</main>

<script>
    if (sessionStorage.getItem("attendanceRole") !== "admin") {
        window.location.replace("index.html");
    }

    const studentsKey = "attendanceStudents";
    const recordsKey = "attendanceRecords";

    if (!localStorage.getItem(studentsKey)) {
        localStorage.setItem(studentsKey, JSON.stringify([
            { id: "S001", name: "Rahul Kumar" },
            { id: "S002", name: "Priya Sharma" },
            { id: "S003", name: "Arjun Reddy" }
        ]));
    }

    if (!localStorage.getItem(recordsKey)) {
        localStorage.setItem(recordsKey, JSON.stringify([]));
    }

    const getStudents = () =>
        JSON.parse(localStorage.getItem(studentsKey) || "[]");

    const getRecords = () =>
        JSON.parse(localStorage.getItem(recordsKey) || "[]");

    // Set today's date
    const dateInput = document.getElementById("attendanceDate");
    const today = new Date();
    dateInput.value =
        `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}-${String(today.getDate()).padStart(2, "0")}`;

    function render() {
        const students = getStudents();
        const records = getRecords();
        const date = dateInput.value;

        document.getElementById("totalStudents").textContent =
            students.length;

        const todaysRecords = records.filter(r => r.date === date);

        document.getElementById("presentToday").textContent =
            todaysRecords.filter(r => r.status === "Present").length;

        document.getElementById("absentToday").textContent =
            todaysRecords.filter(r => r.status === "Absent").length;

        const table = document.getElementById("attendanceTable");
        table.replaceChildren();

        students.forEach(student => {
            const existing = records.find(
                r => r.id === student.id && r.date === date
            );

            const tr = document.createElement("tr");
            const idCell = document.createElement("td");
            const nameCell = document.createElement("td");
            const statusCell = document.createElement("td");
            const select = document.createElement("select");

            idCell.textContent = student.id;
            nameCell.textContent = student.name;

            ["Present", "Absent"].forEach(status => {
                const option = document.createElement("option");
                option.value = status;
                option.textContent = status;
                select.appendChild(option);
            });

            if (existing) {
                select.value = existing.status;
            }

            select.dataset.id = student.id;
            statusCell.appendChild(select);
            tr.append(idCell, nameCell, statusCell);
            table.appendChild(tr);
        });

        const recordsTable = document.getElementById("recordsTable");
        recordsTable.replaceChildren();

        const sortedRecords = [...records].sort(
            (a, b) => b.date.localeCompare(a.date)
        );

        sortedRecords.forEach(record => {
            const tr = document.createElement("tr");

            [
                record.id,
                record.name,
                record.date,
                record.status
            ].forEach(value => {
                const td = document.createElement("td");
                td.textContent = value;
                tr.appendChild(td);
            });

            recordsTable.appendChild(tr);
        });
    }

    document.getElementById("studentForm").addEventListener(
        "submit", function(event) {
            event.preventDefault();

            const id = document.getElementById("studentId")
                .value.trim().toUpperCase();
            const name = document.getElementById("studentName")
                .value.trim();

            if (getStudents().some(s => s.id === id)) {
                alert("This student ID already exists!");
                return;
            }

            const students = getStudents();
            students.push({ id, name });

            localStorage.setItem(studentsKey, JSON.stringify(students));

            this.reset();
            render();
            alert("Student added successfully!");
        }
    );

    function saveAttendance() {
        const date = dateInput.value;

        if (!date) {
            alert("Please select a date.");
            return;
        }

        const students = getStudents();
        const records = getRecords();

        document.querySelectorAll("#attendanceTable select").forEach(select => {
            const student = students.find(s => s.id === select.dataset.id);
            const index = records.findIndex(
                r => r.id === student.id && r.date === date
            );

            const record = {
                id: student.id,
                name: student.name,
                date: date,
                status: select.value
            };

            if (index >= 0) {
                records[index] = record;
            } else {
                records.push(record);
            }
        });

        localStorage.setItem(recordsKey, JSON.stringify(records));

        document.getElementById("message").textContent =
            "Attendance saved successfully!";

        render();
    }

    dateInput.addEventListener("change", render);

    function logout() {
        sessionStorage.removeItem("attendanceRole");
        window.location.href = "index.html";
    }

    render();
</script>

</body>
</html>
